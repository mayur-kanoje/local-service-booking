<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Local Service</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    90deg,
                    rgba(3, 20, 30, 0.82),
                    rgba(3, 20, 30, 0.48)
                ),
                url("image/background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }


        /* ================= CONTAINER ================= */

        .signup-container {
            width: 100%;
            max-width: 480px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 18px;

            padding: 38px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.30);
        }


        /* ================= LOGO ================= */

        .logo {
            text-align: center;

            margin-bottom: 8px;

            font-size: 29px;
            font-weight: 800;

            color: #172033;
        }

        .logo span {
            color: #147df5;
        }


        /* ================= HEADING ================= */

        .signup-container h1 {
            text-align: center;

            margin-bottom: 8px;

            font-size: 28px;

            color: #172033;
        }

        .subtitle {
            text-align: center;

            margin-bottom: 28px;

            color: #64748b;

            font-size: 14px;
        }


        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d8e0ea;

            border-radius: 9px;

            outline: none;

            background: #ffffff;

            color: #172033;

            font-size: 15px;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #147df5;

            box-shadow:
                0 0 0 3px rgba(20, 125, 245, 0.10);
        }


        /* ================= SIGNUP BUTTON ================= */

        .signup-submit {
            width: 100%;

            margin-top: 8px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #147df5;

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }

        .signup-submit:hover {
            background: #0867d2;

            transform: translateY(-1px);
        }


        /* ================= LOGIN INFO ================= */

        .login-info {
            text-align: center;

            margin-top: 22px;

            color: #64748b;

            font-size: 14px;
        }

        .home-link {
            display: block;

            margin-top: 14px;

            text-align: center;

            color: #147df5;

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;
        }

        .home-link:hover {
            text-decoration: underline;
        }


        /* ================= ERROR ================= */

        .error-message {
            display: none;

            margin-bottom: 15px;

            padding: 11px 13px;

            border-radius: 8px;

            background: #fff1f2;

            border: 1px solid #fecdd3;

            color: #be123c;

            font-size: 13px;
        }


        /* ================= SUCCESS ================= */

        .success-message {
            display: none;

            margin-bottom: 15px;

            padding: 11px 13px;

            border-radius: 8px;

            background: #f0fdf4;

            border: 1px solid #bbf7d0;

            color: #15803d;

            font-size: 13px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 550px) {

            body {
                padding: 18px;
            }

            .signup-container {
                padding: 28px 22px;
            }

            .signup-container h1 {
                font-size: 25px;
            }

        }

    </style>
</head>


<body>


    <!-- ================= SIGNUP CARD ================= -->

    <div class="signup-container">


        <!-- LOGO -->

        <div class="logo">
            Local<span>Service</span>
        </div>


        <!-- HEADING -->

        <h1>
            Create Your Account
        </h1>

        <p class="subtitle">
            Sign up once and start booking local services.
        </p>


        <!-- ERROR -->

        <div
            id="errorMessage"
            class="error-message">
        </div>


        <!-- SUCCESS -->

        <div
            id="successMessage"
            class="success-message">
        </div>


        <!-- ================= FORM ================= -->

        <form
            id="signupForm"
            onsubmit="createAccount(event)">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter your mobile number"
                    maxlength="10"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="signup-submit">

                Create Account

            </button>

        </form>


        <!-- INFO -->

        <div class="login-info">
            Already registered? Your account will stay signed in on this browser.
        </div>


        <!-- HOME -->

        <a
            href="index.html"
            class="home-link">

            ← Back to Home

        </a>

    </div>



    <!-- ================= JAVASCRIPT ================= -->
<script>

    async function createAccount(event) {

        event.preventDefault();

        const name =
            document.getElementById("name")
                .value
                .trim();

        const email =
            document.getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const phone =
            document.getElementById("mobile")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;

        const confirmPassword =
            document.getElementById("confirmPassword")
                .value;

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");

        const submitButton =
            document.querySelector(".signup-submit");


        // =========================
        // CLEAR MESSAGES
        // =========================

        errorMessage.style.display = "none";
        successMessage.style.display = "none";


        // =========================
        // FRONTEND VALIDATION
        // =========================

        if (name.length < 2) {

            showError(
                "Please enter your full name."
            );

            return;
        }


        if (!email) {

            showError(
                "Please enter your email address."
            );

            return;
        }


        if (
            phone.length !== 10 ||
            !/^[0-9]+$/.test(phone)
        ) {

            showError(
                "Please enter a valid 10-digit mobile number."
            );

            return;
        }


        if (password.length < 6) {

            showError(
                "Password must contain at least 6 characters."
            );

            return;
        }


        if (password !== confirmPassword) {

            showError(
                "Password and confirm password do not match."
            );

            return;
        }


        // =========================
        // DISABLE BUTTON
        // =========================

        submitButton.disabled = true;
        submitButton.innerText = "Creating Account...";


        try {

            // =========================
            // SEND DATA TO FLASK
            // =========================

            const response = await fetch(
                "http://127.0.0.1:5000/api/auth/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        // IMPORTANT:
                        // Backend expects these names

                        name: name,
                        email: email,
                        phone: phone,

                        password: password,

                        // Current signup form
                        // does not have address/city

                        address: "",
                        city: ""

                    })
                }
            );


            const data = await response.json();


            // =========================
            // BACKEND ERROR
            // =========================

            if (!response.ok || !data.success) {

                showError(
                    data.message ||
                    "Signup failed. Please try again."
                );

                submitButton.disabled = false;
                submitButton.innerText = "Create Account";

                return;
            }


            // =========================
            // SAVE USER DATA
            // PASSWORD IS NOT SAVED
            // =========================

            const user = {

                id: data.user.id,

                name: data.user.name,

                email: data.user.email,

                phone: data.user.phone,

                address: data.user.address || "",

                city: data.user.city || ""

            };


            localStorage.setItem(
                "localServiceUser",
                JSON.stringify(user)
            );


            localStorage.setItem(
                "localServiceLoggedIn",
                "true"
            );


            // =========================
            // SUCCESS
            // =========================

            successMessage.innerText =
                "Account created successfully!";

            successMessage.style.display =
                "block";


            // =========================
            // REDIRECT
            // =========================

            setTimeout(function () {

                window.location.href =
                    "index.html";

            }, 1000);


        } catch (error) {

            console.error(
                "Signup Error:",
                error
            );


            showError(
                "Unable to connect to server. Please make sure the backend is running."
            );


            submitButton.disabled = false;

            submitButton.innerText =
                "Create Account";

        }

    }


    // =========================
    // ERROR FUNCTION
    // =========================

    function showError(message) {

        const errorMessage =
            document.getElementById("errorMessage");


        errorMessage.innerText =
            message;


        errorMessage.style.display =
            "block";

    }

</script>
   

</body>

</html>
